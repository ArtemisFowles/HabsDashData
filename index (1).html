<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6e719d">
  <title>Habsdash Results</title>
  <style>
    :root {
      --red: #e53935;
      --orange: #fb8c00;
      --yellow: #fdd835;
      --green: #43a047;
      --blue: #1e88e5;
      --purple: #8e24aa;

      --habs-purple: #6e719d; /* sampled from the Habs logo */
      --navy: #1b1b3a;
      --text: #1d1d2b;
      --muted: #5d6070;
      --border: #d9d9e3;
      --danger: #c62828;
      --ok: #2e7d32;

      --rainbow: linear-gradient(90deg, var(--red), var(--orange), var(--yellow), var(--green), var(--blue), var(--purple));

      /* To use the real jacket photo: save it next to index.html (e.g. jacket.jpg)
         and replace the line below with:  --jacket-photo: url('jacket.jpg');  */
      --jacket-photo: none;
    }

    * { box-sizing: border-box; }

    html { background: #ffffff; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      min-height: 100vh;
    }

    /* ---------- Soft rainbow background (40% opacity) ---------- */
    .bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: 0.4;
      background:
        radial-gradient(circle at 8% 6%,  var(--red)    0, transparent 38%),
        radial-gradient(circle at 92% 14%, var(--orange) 0, transparent 40%),
        radial-gradient(circle at 20% 38%, var(--yellow) 0, transparent 38%),
        radial-gradient(circle at 88% 55%, var(--green)  0, transparent 42%),
        radial-gradient(circle at 12% 78%, var(--blue)   0, transparent 42%),
        radial-gradient(circle at 85% 95%, var(--purple) 0, transparent 45%);
    }
    .bg-photo {
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: 0.4;
      background-image: var(--jacket-photo);
      background-size: cover;
      background-position: center;
    }

    /* ---------- Header ---------- */
    header {
      background: var(--habs-purple);
      text-align: center;
      padding: 18px 16px 14px;
      position: relative;
    }
    header::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 6px;
      background: var(--rainbow);
    }
    header h1 {
      margin: 0;
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1.15;
    }
    /* Each letter gets its own colour, with a black outline drawn outside the fill */
    header h1 span {
      -webkit-text-stroke: 7px #000;
      paint-order: stroke fill;
    }
    header h1 .l0 { color: var(--red); }
    header h1 .l1 { color: var(--orange); }
    header h1 .l2 { color: var(--yellow); }
    header h1 .l3 { color: var(--green); }
    header h1 .l4 { color: var(--blue); }
    header h1 .l5 { color: var(--purple); }
    header p {
      margin: 2px 0 0;
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    main { max-width: 480px; margin: 0 auto; padding: 16px; }

    /* ---------- Cards ---------- */
    .card {
      background: rgba(255, 255, 255, 0.93);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 10px rgba(27, 27, 58, 0.15);
      border-top: 6px solid transparent;
      border-image: var(--rainbow) 1;
      border-image-slice: 1;
    }
    h2 { margin: 0 0 12px; font-size: 1.15rem; color: var(--navy); }

    label { display: block; font-weight: 700; margin: 14px 0 4px; color: var(--navy); }

    input[type="text"], input[type="number"] {
      width: 100%;
      font-family: inherit;
      font-size: 1.6rem;
      font-weight: 700;
      text-align: center;
      padding: 14px;
      border: 3px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
    }
    input:focus { outline: none; border-color: var(--purple); box-shadow: 0 0 0 4px rgba(142, 36, 170, 0.2); }
    input::placeholder { font-weight: 400; color: #a3a6b4; }

    .toggle { display: flex; gap: 8px; }
    .toggle button {
      flex: 1;
      padding: 12px;
      font-size: 1rem;
      font-weight: 700;
      border: 3px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: var(--navy);
      cursor: pointer;
    }
    .toggle button.active {
      border-color: var(--navy);
      background: var(--navy);
      color: #fff;
    }

    .btn {
      position: relative;
      width: 100%;
      font-size: 1.2rem;
      font-weight: 800;
      padding: 16px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      color: #fff;
      background: var(--navy);
      margin-top: 18px;
      overflow: hidden;
    }
    .btn::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 5px;
      background: var(--rainbow);
    }
    .btn.submit { background: var(--ok); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .msg { margin-top: 12px; padding: 12px; border-radius: 10px; font-size: 0.95rem; display: none; }
    .msg.show { display: block; }
    .msg.error { background: #fde8eb; color: var(--danger); }
    .msg.success { background: #e3f6ea; color: var(--ok); }
    .msg.warn { background: #fff4d6; color: #7a5600; }

    /* ---------- Pending list ---------- */
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    li:last-child { border-bottom: none; }
    li.new { animation: flash 1.2s ease-out; }
    @keyframes flash {
      0%   { background: rgba(253, 216, 53, 0.7); }
      100% { background: transparent; }
    }

    .pos {
      min-width: 58px;
      text-align: center;
      font-size: 1.3rem;
      font-weight: 900;
      padding: 8px 6px;
      border-radius: 12px;
      color: #fff;
    }
    /* Badge colour cycles through the six Habsdash colours */
    .pos.c0 { background: var(--red); }
    .pos.c1 { background: var(--orange); color: #2b1a00; }
    .pos.c2 { background: var(--yellow); color: #2b2500; }
    .pos.c3 { background: var(--green); }
    .pos.c4 { background: var(--blue); }
    .pos.c5 { background: var(--purple); }

    .who { flex: 1; word-break: break-word; font-weight: 700; font-size: 1.1rem; }
    .who small { display: block; color: var(--muted); font-weight: 400; font-size: 0.85rem; }

    .remove {
      background: #fff;
      border: 2px solid var(--danger);
      color: var(--danger);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }
    .empty { color: var(--muted); text-align: center; padding: 8px 0; }

    /* ---------- Watermark logo ---------- */
    .watermark { text-align: center; padding: 8px 0 28px; }
    .watermark img {
      width: 200px;
      max-width: 55%;
      height: auto;
      opacity: 0.4;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="bg-photo"></div>

  <header>
    <h1 aria-label="Habsdash"><span class="l0">H</span><span class="l1">a</span><span class="l2">b</span><span class="l3">s</span><span class="l4">d</span><span class="l5">a</span><span class="l0">s</span><span class="l1">h</span></h1>
    <p>Race results</p>
  </header>

  <main>
    <!-- Entry form -->
    <section class="card">
      <h2>Record a runner</h2>

      <div class="toggle" role="group" aria-label="Identify runner by">
        <button type="button" id="modeCode" class="active">Runner code</button>
        <button type="button" id="modeName">Enter name</button>
      </div>

      <div id="codeField">
        <label for="runnerCode">Runner code</label>
        <input type="text" id="runnerCode" inputmode="numeric" autocomplete="off" placeholder="e.g. 201932">
      </div>

      <div id="nameField" hidden>
        <label for="runnerName">Runner name</label>
        <input type="text" id="runnerName" autocomplete="off" placeholder="e.g. Alex Smith">
      </div>

      <label for="position">Finishing position</label>
      <input type="number" id="position" inputmode="numeric" min="1" step="1" placeholder="e.g. 24">

      <button type="button" class="btn" id="addBtn">Add to list</button>
      <div class="msg" id="formMsg"></div>
    </section>

    <!-- Pending list -->
    <section class="card">
      <h2>Ready to submit (<span id="count">0</span>)</h2>
      <ul id="list"></ul>
      <div class="empty" id="emptyMsg">Nothing added yet.</div>

      <button type="button" class="btn submit" id="submitBtn" disabled>Submit results</button>
      <div class="msg" id="submitMsg"></div>
    </section>

    <div class="watermark">
      <img src="habs-logo.png" alt="Haberdashers' Elstree Schools">
    </div>
  </main>

  <script>
    // ====== CONFIGURATION ======
    const SUPABASE_URL = 'https://ovgkfpumbwneicglkxoe.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92Z2tmcHVtYnduZWljZ2xreG9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0Njk1MzMsImV4cCI6MjA5NjA0NTUzM30.UhHBm3ek0F1bv2vANyA1CC1e3FiI03C7J5x4uJbOULU';
    const TABLE = "race_results";
    // ===========================

    const STORAGE_KEY = "habsdash_pending_v1";

    const $ = (id) => document.getElementById(id);
    const els = {
      modeCode: $("modeCode"),
      modeName: $("modeName"),
      codeField: $("codeField"),
      nameField: $("nameField"),
      runnerCode: $("runnerCode"),
      runnerName: $("runnerName"),
      position: $("position"),
      addBtn: $("addBtn"),
      submitBtn: $("submitBtn"),
      list: $("list"),
      count: $("count"),
      emptyMsg: $("emptyMsg"),
      formMsg: $("formMsg"),
      submitMsg: $("submitMsg"),
    };

    let mode = "code"; // "code" or "name"
    let pending = loadPending();
    let lastAddedId = null;

    // ---------- Helpers ----------
    function loadPending() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return Array.isArray(saved) ? saved : [];
      } catch (e) {
        return [];
      }
    }

    function savePending() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(pending));
      } catch (e) {
        /* storage unavailable: app still works, just won't survive a refresh */
      }
    }

    function showMsg(el, text, type) {
      el.textContent = text;
      el.className = "msg show " + type;
    }

    function clearMsg(el) {
      el.textContent = "";
      el.className = "msg";
    }

    function formatTime(iso) {
      return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }

    // ---------- Mode toggle ----------
    function setMode(newMode) {
      mode = newMode;
      const isCode = mode === "code";
      els.modeCode.classList.toggle("active", isCode);
      els.modeName.classList.toggle("active", !isCode);
      els.codeField.hidden = !isCode;
      els.nameField.hidden = isCode;
      clearMsg(els.formMsg);
      (isCode ? els.runnerCode : els.runnerName).focus();
    }

    els.modeCode.addEventListener("click", () => setMode("code"));
    els.modeName.addEventListener("click", () => setMode("name"));

    // ---------- Add an entry ----------
    function addEntry() {
      clearMsg(els.formMsg);
      clearMsg(els.submitMsg);

      const position = parseInt(els.position.value, 10);
      const code = els.runnerCode.value.trim();
      const name = els.runnerName.value.trim();

      if (!Number.isInteger(position) || position < 1) {
        showMsg(els.formMsg, "Please enter a finishing position (1 or higher).", "error");
        els.position.focus();
        return;
      }
      if (mode === "code" && !code) {
        showMsg(els.formMsg, "Please enter a runner code.", "error");
        els.runnerCode.focus();
        return;
      }
      if (mode === "name" && !name) {
        showMsg(els.formMsg, "Please enter the runner's name.", "error");
        els.runnerName.focus();
        return;
      }

      // Soft warnings for likely mistakes (the entry is still added)
      const warnings = [];
      if (pending.some((p) => p.position === position)) {
        warnings.push("Position " + position + " is already in the list.");
      }
      if (mode === "code" && pending.some((p) => p.runner_code === code)) {
        warnings.push("Code " + code + " is already in the list.");
      }

      const entry = {
        id: Date.now() + "-" + Math.random().toString(36).slice(2, 7), // local id only
        runner_code: mode === "code" ? code : null,
        runner_name: mode === "name" ? name : null,
        position: position,
        recorded_at: new Date().toISOString(), // time of recording
      };
      pending.push(entry);
      lastAddedId = entry.id;
      savePending();
      render();

      if (navigator.vibrate) navigator.vibrate(30); // small buzz so you know it registered

      els.runnerCode.value = "";
      els.runnerName.value = "";
      els.position.value = "";

      if (warnings.length) {
        showMsg(els.formMsg, "Added, but check: " + warnings.join(" "), "warn");
      }
      (mode === "code" ? els.runnerCode : els.runnerName).focus();
    }

    els.addBtn.addEventListener("click", addEntry);
    [els.runnerCode, els.runnerName, els.position].forEach((input) => {
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          addEntry();
        }
      });
    });

    // ---------- Render pending list ----------
    function render() {
      els.list.innerHTML = "";
      // Newest at the top
      [...pending].reverse().forEach((entry) => {
        const li = document.createElement("li");
        if (entry.id === lastAddedId) li.className = "new";

        const pos = document.createElement("span");
        pos.className = "pos c" + (entry.position % 6);
        pos.textContent = "#" + entry.position;

        const who = document.createElement("span");
        who.className = "who";
        who.textContent = entry.runner_code ? "Code " + entry.runner_code : entry.runner_name;
        const small = document.createElement("small");
        small.textContent = "Recorded " + formatTime(entry.recorded_at);
        who.appendChild(small);

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "remove";
        remove.textContent = "Remove";
        remove.addEventListener("click", () => {
          pending = pending.filter((p) => p.id !== entry.id);
          savePending();
          render();
        });

        li.append(pos, who, remove);
        els.list.appendChild(li);
      });

      els.count.textContent = pending.length;
      els.emptyMsg.style.display = pending.length ? "none" : "block";
      els.submitBtn.disabled = pending.length === 0;
    }

    // ---------- Submit to Supabase ----------
    async function submitAll() {
      if (!pending.length) return;
      clearMsg(els.submitMsg);

      els.submitBtn.disabled = true;
      els.submitBtn.textContent = "Submitting...";

      // Snapshot what we're sending, so anything added during the request isn't lost
      const batch = pending.slice();
      const rows = batch.map((p) => ({
        runner_code: p.runner_code,
        runner_name: p.runner_name,
        position: p.position,
        recorded_at: p.recorded_at,
      }));

      try {
        const response = await fetch(SUPABASE_URL + "/rest/v1/" + TABLE, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            apikey: SUPABASE_ANON_KEY,
            Authorization: "Bearer " + SUPABASE_ANON_KEY,
            Prefer: "return=minimal",
          },
          body: JSON.stringify(rows),
        });

        if (!response.ok) {
          const detail = await response.text();
          throw new Error("Server said " + response.status + ": " + detail);
        }

        const sentIds = new Set(batch.map((p) => p.id));
        pending = pending.filter((p) => !sentIds.has(p.id));
        savePending();
        render();
        showMsg(els.submitMsg, "Submitted " + batch.length + " result" + (batch.length === 1 ? "" : "s") + " successfully.", "success");
      } catch (err) {
        // Nothing is cleared on failure, so no results are lost
        showMsg(els.submitMsg, "Couldn't submit. Your list is still saved, so try again. (" + err.message + ")", "error");
      } finally {
        els.submitBtn.textContent = "Submit results";
        els.submitBtn.disabled = pending.length === 0;
      }
    }

    els.submitBtn.addEventListener("click", submitAll);

    render();
  </script>
</body>
</html>
